name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev python3-tk
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: python scripts/check_release.py
      - run: python scripts/check_owrx_config.py
      - run: python scripts/build_native.py
      - run: pytest -q

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and tests
        run: |
          pacman -Syu --noconfirm python python-pip tk portaudio
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install ".[dev]"
          .venv/bin/ruff check src tests
          .venv/bin/mypy src
          .venv/bin/python scripts/check_release.py
          .venv/bin/python scripts/check_owrx_config.py
          .venv/bin/python scripts/build_native.py
          .venv/bin/pytest -q

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m build plugins/filter-relays
      - run: python scripts/check_release.py
      - run: python scripts/check_owrx_config.py
      - run: python scripts/write_checksums.py
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-distributions
          path: |
            dist/*
            plugins/*/dist/*
