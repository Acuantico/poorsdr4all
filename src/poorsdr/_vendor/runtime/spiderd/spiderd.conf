# spiderd configuration

[source]
# mqtt or telnet
kind = mqtt

[mqtt]
# Example (URE): wss://ws.ure.es:443/mqtt
url = wss://ws.ure.es:443/mqtt
topics = spider/spots/dx,spider/spots/rbn-cw,spider/spots/rbn-dig
username =
password =
client_id = N0CALL-poorsdr4
qos = 0
keepalive = 30

[cluster]
# DX Cluster host/port for telnet mode
host = dxspider.example.net
port = 7300
user = N0CALL
password =
read_timeout = 120

[server]
bind = 127.0.0.1
port = 7373
path = /spots

[reconnect]
initial_delay = 3
max_delay = 60

[logging]
level = INFO
