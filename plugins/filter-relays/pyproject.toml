[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poorsdr-filter-relays"
version = "1.0.0a1"
description = "Plugin de relés de filtros WiFi por banda para PoorSDR4All"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Acuantico Power" }]
dependencies = ["poorsdr4all"]

[project.entry-points."poorsdr.plugins"]
filter_relays = "poorsdr_filter_relays.plugin:PLUGIN"

[tool.setuptools.packages.find]
where = ["src"]
